<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <line x1="60" y1="90" x2="840" y2="90" stroke="#1f2328" stroke-width="2"/>

  <g stroke="#57606a" stroke-width="1">
    <line x1="130" y1="38" x2="130" y2="52"/>
    <line x1="290" y1="38" x2="290" y2="52"/>
    <line x1="130" y1="45" x2="290" y2="45"/>
  </g>
  <text x="210" y="38" text-anchor="middle" fill="#57606a">1.5 m</text>

  <g stroke="#afb8c1" stroke-width="1.5">
    <line x1="130" y1="90" x2="130" y2="186"/>
    <line x1="770" y1="90" x2="770" y2="186"/>
  </g>
  <g fill="#ffffff" stroke="#afb8c1" stroke-width="1.5">
    <circle cx="130" cy="197" r="11"/>
    <circle cx="770" cy="197" r="11"/>
  </g>
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="290" y1="90" x2="290" y2="186"/>
    <line x1="610" y1="90" x2="610" y2="186"/>
  </g>
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="1.5">
    <circle cx="290" cy="197" r="11"/>
    <circle cx="610" cy="197" r="11"/>
  </g>
  <line x1="450" y1="90" x2="450" y2="186" stroke="#1f2328" stroke-width="2"/>
  <circle cx="450" cy="197" r="11" fill="#1f2328"/>

  <g text-anchor="middle" font-weight="600">
    <text x="130" y="80" fill="#8c959f">1</text>
    <text x="290" y="80">2</text>
    <text x="450" y="80">3</text>
    <text x="610" y="80">4</text>
    <text x="770" y="80">5</text>
  </g>
  <g text-anchor="middle" fill="#8c959f">
    <text x="130" y="234">out of reach</text>
    <text x="770" y="234">out of reach</text>
  </g>

  <g stroke="#57606a" stroke-width="1">
    <line x1="215" y1="240" x2="685" y2="240"/>
    <line x1="215" y1="233" x2="215" y2="247"/>
    <line x1="685" y1="233" x2="685" y2="247"/>
  </g>
  <text x="450" y="262" text-anchor="middle" fill="#57606a">reach of 3: 2.2 m</text>

  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M290,210 C290,280 330,320 376,334"/>
    <path d="M610,210 C610,280 570,320 524,334"/>
  </g>
  <text x="270" y="300" text-anchor="end">pendulums:2:position</text>
  <text x="630" y="300">pendulums:4:position</text>

  <rect x="380" y="320" width="140" height="44" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="450" y="347" text-anchor="middle" font-weight="600">server 3</text>

  <g fill="#57606a">
    <text x="40" y="404">Neighbors when the anchors are closer than length A + length B + radius A + radius B + CONTACT_MARGIN_M.</text>
    <text x="40" y="426">Radius is 0.1 m × ∛mass. Here: 1 m strings, 1 kg bobs, CONTACT_MARGIN_M = 0.</text>
    <text x="40" y="448">Every server does the same; shown for server 3. Neighbors are recomputed when configs or peers change.</text>
  </g>
</svg>
