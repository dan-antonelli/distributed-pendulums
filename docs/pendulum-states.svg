<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <rect x="300" y="30" width="566" height="356" rx="12" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke-width="1.5">
    <rect x="24" y="165" width="140" height="50" rx="8" fill="#f6f8fa" stroke="#57606a"/>
    <rect x="380" y="50" width="140" height="50" rx="8" fill="#f6f8fa" stroke="#57606a"/>
    <rect x="380" y="170" width="140" height="50" rx="8" fill="#f6f8fa" stroke="#57606a"/>
    <rect x="700" y="170" width="140" height="50" rx="8" fill="#ffffff" stroke="#d1242f" stroke-width="2"/>
    <rect x="380" y="310" width="140" height="50" rx="8" fill="#ffffff" stroke="#d1242f" stroke-width="2"/>
    <rect x="700" y="310" width="140" height="50" rx="8" fill="#ffffff" stroke="#d1242f" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="94" y="195">STOPPED</text>
    <text x="450" y="80">PAUSED</text>
    <text x="450" y="200">RUNNING</text>
    <text x="770" y="200">WAITING</text>
    <text x="450" y="340">HALTED</text>
    <text x="770" y="340">READY</text>
  </g>

  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="164" y1="180" x2="376" y2="180"/>
    <line x1="300" y1="204" x2="168" y2="204"/>
    <line x1="430" y1="170" x2="430" y2="104"/>
    <line x1="470" y1="100" x2="470" y2="166"/>
    <line x1="450" y1="220" x2="450" y2="306"/>
    <line x1="520" y1="335" x2="696" y2="335"/>
    <line x1="770" y1="310" x2="770" y2="224"/>
    <line x1="700" y1="195" x2="524" y2="195"/>
  </g>

  <g text-anchor="middle">
    <text x="232" y="171">START</text>
    <text x="232" y="225">STOP</text>
    <text x="232" y="243" fill="#57606a">from any phase</text>
    <text x="610" y="164">after 5 s, reset to</text>
    <text x="610" y="182">starting angle</text>
    <text x="610" y="356">RESTART from all</text>
  </g>
  <text x="420" y="141" text-anchor="end">PAUSE</text>
  <text x="480" y="141">START</text>
  <text x="462" y="260">collision, or a</text>
  <text x="462" y="278">newer cycle</text>
  <text x="758" y="271" text-anchor="end">READY from all</text>

  <g fill="#57606a">
    <text x="24" y="418">STOP, START and PAUSE are user commands. A STOPPED pendulum ignores cycle messages.</text>
    <text x="24" y="440">START and PAUSE are ignored during a cycle. A PAUSED pendulum also moves to HALTED on a newer cycle.</text>
  </g>
</svg>
