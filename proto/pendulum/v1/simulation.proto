syntax = "proto3";

package pendulum.v1;

import "pendulum/v1/pendulum.proto";

// An empty command response means "accepted", not "applied by every server": the bus has no replies.
// The real effect shows up on the WatchPendulums stream.
service SimulationService {
  // A full snapshot of every live pendulum, every 50 ms.
  rpc WatchPendulums(WatchPendulumsRequest) returns (stream WatchPendulumsResponse);

  // Errors: INVALID_ARGUMENT (bad values or bobs would start touching),
  // NOT_FOUND (unknown id), FAILED_PRECONDITION (simulation not stopped).
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);

  // Errors: FAILED_PRECONDITION (simulation not stopped).
  rpc ResetConfig(ResetConfigRequest) returns (ResetConfigResponse);

  rpc Start(StartRequest) returns (StartResponse);
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc Stop(StopRequest) returns (StopResponse);
}

message WatchPendulumsRequest {}

message WatchPendulumsResponse {
  repeated PendulumView pendulums = 1;
}

message PendulumView {
  uint32 id = 1;
  PendulumConfig config = 2;
  PendulumPhase phase = 3;
  double bob_x_m = 4;
  double bob_y_m = 5;
  uint32 cycle = 6;
  uint32 restart_in_ms = 7;
}

// `optional` lets "not sent" differ from "set to 0": only set fields change.
message UpdateConfigRequest {
  uint32 id = 1;
  optional double anchor_x_m = 2;
  optional double length_m = 3;
  optional double mass_kg = 4;
  optional double initial_angle_rad = 5;
}

message UpdateConfigResponse {}

message ResetConfigRequest {}
message ResetConfigResponse {}

message StartRequest {}
message StartResponse {}

message PauseRequest {}
message PauseResponse {}

message StopRequest {}
message StopResponse {}
